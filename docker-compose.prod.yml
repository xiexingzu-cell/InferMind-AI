# ============================================================
# InferMind — 单服务器 Docker Compose 生产部署
# ============================================================
#
# 启动命令:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# 查看状态:
#   docker compose -f docker-compose.prod.yml ps
#
# 查看日志:
#   docker compose -f docker-compose.prod.yml logs -f
#
# 停止:
#   docker compose -f docker-compose.prod.yml down
# ============================================================

services:
  # ===================== Nginx =====================
  nginx:
    build:
      context: ./nginx
    container_name: infermind-nginx
    ports:
      - "80:80"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - infermind-net
    restart: unless-stopped

  # ===================== Frontend =====================
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_INTERNAL_API_KEY: ${INTERNAL_API_KEY:-gw-dev-internal-key}
    container_name: infermind-frontend
    expose:
      - "3000"
    networks:
      - infermind-net
    restart: unless-stopped

  # ===================== Backend =====================
  backend:
    build:
      context: ./backend
    container_name: infermind-backend
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-gw-dev-internal-key}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-60}
      - COMPETITION_STORAGE_PATH=/data/competitions
      - COMPETITION_QUEUE_NAME=${COMPETITION_QUEUE_NAME:-competition:jobs}
      - COMPETITION_MAX_UPLOAD_BYTES=${COMPETITION_MAX_UPLOAD_BYTES:-52428800}
      - COMPETITION_MODEL=${COMPETITION_MODEL:-deepseek-chat}
    volumes:
      - competition_prod_data:/data/competitions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infermind-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ===================== Competition Worker =====================
  competition-worker:
    build:
      context: ./backend
    container_name: infermind-competition-worker
    command: python -m app.worker
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-gw-dev-internal-key}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - COMPETITION_STORAGE_PATH=/data/competitions
      - COMPETITION_QUEUE_NAME=${COMPETITION_QUEUE_NAME:-competition:jobs}
      - COMPETITION_MAX_UPLOAD_BYTES=${COMPETITION_MAX_UPLOAD_BYTES:-52428800}
      - COMPETITION_MODEL=${COMPETITION_MODEL:-deepseek-chat}
      - COMPETITION_RUNNER_IMAGE=${COMPETITION_RUNNER_IMAGE:-infermind-python-runner:0.1.0}
    volumes:
      - competition_prod_data:/data/competitions
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infermind-net
    restart: unless-stopped

  # Build this private image before starting the worker. It is launched
  # ephemerally for generated Python tasks and is never exposed by Nginx.
  competition-runner-image:
    build:
      context: ./backend/runner
    image: infermind-python-runner:0.1.0
    profiles: ["runner-build"]
    command: ["true"]

  # ===================== PostgreSQL =====================
  postgres:
    image: postgres:16-alpine
    container_name: infermind-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - infermind-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===================== Redis =====================
  redis:
    image: redis:7-alpine
    container_name: infermind-redis
    command: redis-server --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis_prod_data:/data
    networks:
      - infermind-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# ===================== Volumes =====================
volumes:
  postgres_prod_data:
  redis_prod_data:
  competition_prod_data:

# ===================== Network =====================
networks:
  infermind-net:
    driver: bridge
